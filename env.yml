# Lipophilicity logD 核心环境（Python 3.12.15）
# 重建（strict channel priority 下必须放宽）：
#   $env:CONDA_CHANNEL_PRIORITY="flexible"
#   conda env create -f env.yml
# 核心依赖包含 rdkit/pandas/numpy/scikit-learn/joblib；
# predict.py 的残差图用 Pillow，不依赖 matplotlib。
# 可选：matplotlib==3.11.2（analyze_errors.py 需要）；
# 可选：torch==2.14.1+cu132 / torchvision==0.29.1+cu132（图/图像实验需要）。
name: myenv
channels:
  - conda-forge
  - defaults
